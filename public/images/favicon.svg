  </style>
  <circle class="film-reel" cx="12" cy="12" r="9" />
  <circle class="film-dot" cx="12" cy="12" r="2.5" />
  <circle class="film-dot" cx="8" cy="8.5" r="1.25" />
  <circle class="film-dot" cx="16" cy="8.5" r="1.25" />
  <circle class="film-dot" cx="8" cy="15.5" r="1.25" />
  <circle class="film-dot" cx="16" cy="15.5" r="1.25" />
</svg>
