<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <style>
    .film-reel { stroke: #1a1a1a; stroke-width: 1.8; fill: none; }
    .film-dot { fill: #1a1a1a; stroke: none; }
